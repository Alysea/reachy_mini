name: Sync fork from upstream

on:
  schedule:
    # Runs daily; GitHub may delay this by a few minutes under load.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository != 'pollen-robotics/reachy_mini'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream/main into fork
        run: |
          git remote add upstream "https://github.com/pollen-robotics/reachy_mini.git"
          git fetch upstream main
          git -c user.name="fork-sync-bot" -c user.email="actions@users.noreply.github.com" \
            merge --no-edit -m "Merge upstream/main into fork (scheduled sync)" upstream/main
          git push origin "HEAD:main"
